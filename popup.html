<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: #0f172a; 
      color: #f8fafc; 
      width: 320px; 
      min-height: 180px; 
      padding: 24px;
      overflow: hidden;
    }
    .logo { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      margin-bottom: 20px; 
    }
    .badge { 
      background: #fff;
      color: #000;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px; 
      font-weight: 800; 
      font-size: 1rem; 
    }
    h2 { 
      font-size: 1.1rem; 
      font-weight: 800; 
      letter-spacing: -0.02em;
    }
    h2 span { color: #3b82f6; }
    p { 
      font-size: 0.85rem; 
      color: #94a3b8; 
      line-height: 1.6; 
      margin-bottom: 24px; 
    }
    .btn { 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%; 
      padding: 14px; 
      background: #fff; 
      color: #000; 
      border: none; 
      border-radius: 12px; 
      font-weight: 700; 
      font-size: 0.9rem; 
      cursor: pointer; 
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn:hover { 
      background: #f1f5f9;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .btn:active { transform: translateY(0); }
    .tip { 
      font-size: 0.75rem; 
      color: #475569; 
      margin-top: 20px; 
      text-align: center; 
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .floating-accent {
      position: absolute;
      top: -20px;
      right: -20px;
      width: 100px;
      height: 100px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
      filter: blur(20px);
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="floating-accent"></div>
  <div class="logo">
    <div class="badge">CB</div>
    <h2>Click<span>Box</span> Importador</h2>
  </div>
  <p>Captura productos de Sam's Club, Amazon y más con un solo clic. Detectamos dimensiones y peso automáticamente.</p>
  <button class="btn" id="openAdmin">
    <span>Abrir Panel de Control</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
  </button>
  <p class="tip">Busca el icono 📦 en la esquina de la tienda</p>
  <script>
    const browserAPI = typeof browser !== 'undefined' ? browser : chrome;
    document.getElementById('openAdmin').onclick = function() {
      browserAPI.tabs.create({ url: 'https://clicbox-81bfc.web.app/admin/productos' });
    };
  </script>
</body>
</html>
